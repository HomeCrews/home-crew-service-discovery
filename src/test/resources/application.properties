# Test-scope configuration. See the note in any service repo: this REPLACES
# src/main/resources/application.properties rather than merging with it, which
# is why the two self-registration flags are repeated here.

spring.application.name=servicediscovery

# Port 0 so a test run does not collide with a Eureka already on 8761.
server.port=0

# This repository IS the Eureka server, so eureka.client.enabled is deliberately
# left alone - only self-registration is switched off, exactly as in src/main.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
